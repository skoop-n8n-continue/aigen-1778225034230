<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
  <!-- skoop-live-runtime -->
  <script src="./skoop-live.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Smasher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="ui">
        <div id="scoreDisplay">Score: <span id="score">0</span></div>
        <div id="highScoreDisplay">Best: <span id="highScore">0</span></div>
        <div id="livesDisplay">Lives: <span id="lives">5</span></div>
        <div id="instruction">Tap or Click to Smash!</div>
    </div>
    <div id="gameOverScreen" style="display: none;">
        <h1 id="gameOverTitle">Game Over</h1>
        <p>Score: <span id="finalScore">0</span></p>
        <p>Tap to Restart</p>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
